<!DOCTYPE html>
<html>
<head>
    <title>Women Safety Alert</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
        }

        .container {
            margin-top: 120px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #222;
        }

        h2 {
            font-weight: normal;
            color: #555;
            margin-bottom: 30px;
        }

        input {
            padding: 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Women Safety Alert System</h1>
    <h2>Emergency Access</h2>

    <input type="text" id="username" placeholder="Enter your name">
    <br><br>

    <button onclick="login()">Start Session</button>

</div>

<script src="script.js"></script>
</body>
</html>
